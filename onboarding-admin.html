<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Onboardings · Sazón</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--r:#C8392B;--t:#1A1814;--m:#6B6560;--l:#E6E1DA;--bg:#FAF8F5;--ok:#2E7D4F;--warn:#B26A00}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.logo{font-family:'Playfair Display',serif;font-weight:900;font-size:1.4rem}.logo span{color:var(--r)}
h1{font-size:1.3rem;margin:.6em 0}
.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px 16px;margin:12px 0}
input[type=text],input[type=email]{padding:11px;border:1px solid #cfc8bf;border-radius:9px;font:inherit;min-width:0}
button{font:inherit;font-weight:600;padding:10px 14px;border-radius:9px;border:1px solid var(--t);background:#fff;cursor:pointer}
button.p{background:var(--r);border-color:var(--r);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{flex:1}
.badge{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px}
.b-pendiente{background:#eee;color:var(--m)}.b-en_curso{background:#FFF1D6;color:var(--warn)}.b-completo{background:#DDF3E5;color:var(--ok)}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item b{font-size:1.02rem}.m{color:var(--m);font-size:.82rem}
.det{margin-top:12px;border-top:1px solid var(--l);padding-top:12px;font-size:.9rem}
.det h3{margin:14px 0 4px;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;color:var(--m)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumbs a{display:block;font-size:.8rem}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--l);display:block}
.msg{color:var(--r);font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<div class="wrap"><div class="logo">Sazón<span>.</span> <span style="font-family:Inter;font-size:.9rem;color:var(--m);font-weight:500">Onboardings</span></div><div id="root"><p class="m">Cargando…</p></div></div>
<script src="./vendor/supabase-js-2.119.2.min.js"></script>
<script src="./sazon-config.js"></script>
<script>
(function(){
const CFG=window.SAZON_CONFIG;
const sb=window.supabase.createClient(CFG.supabase.url,CFG.supabase.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
const root=document.getElementById('root');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BASE=location.origin+'/onboarding?t=';
const LBL={pendiente:'Pendiente',en_curso:'En curso',completo:'Completo'};
let rows=[], open=null, pendingEmail='';

async function init(){
  let session=null;
  try{ ({data:{session}}=await sb.auth.getSession()); }catch(e){}
  if(!session) return loginView();
  const {data:u}=await sb.from('users').select('role').eq('id',session.user.id).maybeSingle();
  if(!u||u.role!=='sazon_admin') return root.innerHTML='<div class="card">Esta página es solo para el equipo de Sazón.</div>';
  await load();
}
function loginView(msg){
  root.innerHTML=`<div class="card"><h1>Entrar</h1><div class="row"><input type="email" id="em" placeholder="tu correo" autocomplete="email"><button class="p" id="go">Enviar código</button></div><div class="msg" id="lm">${esc(msg||'')}</div></div>`;
  document.getElementById('go').onclick=async()=>{
    const email=document.getElementById('em').value.trim(); if(!email) return;
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
    if(error) return document.getElementById('lm').textContent=error.message;
    pendingEmail=email;
    root.innerHTML=`<div class="card"><h1>Código</h1><p class="m">Te enviamos un código de 6 dígitos a ${esc(email)}.</p><div class="row"><input type="text" id="cd" inputmode="numeric" maxlength="6" placeholder="123456"><button class="p" id="vf">Entrar</button></div><div class="msg" id="lm"></div></div>`;
    document.getElementById('vf').onclick=async()=>{
      const {error}=await sb.auth.verifyOtp({email:pendingEmail,token:document.getElementById('cd').value.trim(),type:'email'});
      if(error) return document.getElementById('lm').textContent='Código incorrecto o vencido.';
      init();
    };
  };
}
async function load(){
  const {data,error}=await sb.from('onboardings').select('*').order('created_at',{ascending:false});
  if(error){ root.innerHTML='<div class="card msg">No se pudo cargar: '+esc(error.message)+'</div>'; return; }
  rows=data; draw();
}
function fmt(d){ return d? new Date(d).toLocaleString('es-PE',{timeZone:'America/Lima',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''; }
function draw(){
  root.innerHTML=`<div class="card"><b>Nuevo onboarding</b><div class="row" style="margin-top:8px"><input type="text" id="nb" placeholder="Nombre de la marca (ej. Mr. Smash Burger)"><button class="p" id="cr">Crear link</button></div><div class="msg" id="nm"></div></div>
  ${rows.length?'':'<p class="m">Todavía no hay onboardings.</p>'}
  ${rows.map(r=>`<div class="card" data-id="${r.id}"><div class="item"><div><b>${esc(r.brand_name)}</b> <span class="badge b-${r.status}">${LBL[r.status]}</span><div class="m">${r.status==='completo'?'Completó '+fmt(r.completed_at):'Actualizado '+fmt(r.updated_at)}</div></div>
  <div class="row"><button data-copy="${r.token}">Copiar link</button><button data-open="${r.id}">${open===r.id?'Ocultar':'Ver'}</button></div></div>${open===r.id?detail(r):''}</div>`).join('')}`;
  document.getElementById('cr').onclick=async()=>{
    const n=document.getElementById('nb').value.trim(); if(!n) return;
    const {data,error}=await sb.from('onboardings').insert({brand_name:n}).select().single();
    if(error) return document.getElementById('nm').textContent=error.message;
    try{ await navigator.clipboard.writeText(BASE+data.token); }catch(e){}
    await load(); document.getElementById('nm').textContent='Link creado y copiado: '+BASE+data.token;
  };
}
function detail(r){
  const d=r.data||{}, g=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o)||'—';
  const locs=(d.locales||[]).map((l,i)=>`<div><b>${esc(l.nombre||'Local '+(i+1))}</b> · ${esc(l.direccion||'—')} · ☎ ${esc(l.telefono||'—')}<br><span class="m">${(l.horarios||[]).map(h=>h.cerrado?`${h.d}: cerrado`:`${h.d}: ${h.abre||'?'}–${h.cierra||'?'}`).join(' · ')}</span></div>`).join('<br>')||'—';
  const dl=d.delivery||{};
  const link=(u)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`:'—';
  return `<div class="det"><h3>Contacto</h3>${esc(g(d,'contacto.nombre'))} · ${esc(g(d,'contacto.whatsapp'))}
  <h3>Delivery</h3>${dl.ninguno?'No está en apps':`PedidosYa: ${link(dl.pedidosya)}<br>Rappi: ${link(dl.rappi)}<br>DiDi: ${link(dl.didi)}`}
  <h3>Carta (link)</h3>${link(d.carta&&d.carta.link)}
  <h3>Locales</h3>${locs}
  ${d.comentarios?`<h3>Comentarios</h3>${esc(d.comentarios)}`:''}
  ${['logo','carta','plato','local'].map(k=>`<h3>${{logo:'Logo',carta:'Carta (archivos)',plato:'Fotos de platos',local:'Fotos del local'}[k]}</h3><div class="thumbs" id="f-${r.id}-${k}">${(r.files||[]).filter(f=>f.kind===k).length?'<span class="m">Cargando…</span>':'—'}</div>`).join('')}
  <div class="row" style="margin-top:14px"><button data-sum="${r.id}">Copiar resumen</button></div></div>`;
}
async function loadFiles(r){
  for(const f of (r.files||[])){
    const {data}=await sb.storage.from('onboarding').createSignedUrl(f.path,3600);
    const box=document.getElementById(`f-${r.id}-${f.kind}`); if(!box||!data) continue;
    if(box.querySelector('.m')) box.innerHTML='';
    const isImg=/\.(png|jpe?g|webp|svg|gif)$/i.test(f.path);
    box.insertAdjacentHTML('beforeend',`<a href="${esc(data.signedUrl)}" target="_blank" rel="noopener" download>${isImg?`<img src="${esc(data.signedUrl)}" alt="">`:'📄'}<span>${esc(f.name)}</span></a>`);
  }
}
function summary(r){
  const d=r.data||{}, dl=d.delivery||{};
  return [`ONBOARDING · ${r.brand_name} (${LBL[r.status]})`,
    `Contacto: ${(d.contacto||{}).nombre||''} · ${(d.contacto||{}).whatsapp||''}`,
    `PedidosYa: ${dl.pedidosya||'—'}`,`Rappi: ${dl.rappi||'—'}`,`DiDi: ${dl.didi||'—'}`,
    `Carta (link): ${(d.carta||{}).link||'—'}`,
    ...(d.locales||[]).map((l,i)=>`Local ${i+1}: ${l.nombre||''} · ${l.direccion||''} · ☎ ${l.telefono||''}\n  ${(l.horarios||[]).map(h=>h.cerrado?`${h.d} cerrado`:`${h.d} ${h.abre}-${h.cierra}`).join(', ')}`),
    d.comentarios?`Comentarios: ${d.comentarios}`:'' ].filter(Boolean).join('\n');
}
root.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.copy){ try{ await navigator.clipboard.writeText(BASE+b.dataset.copy); b.textContent='¡Copiado!'; setTimeout(()=>b.textContent='Copiar link',1500);}catch(_){ prompt('Copia el link:',BASE+b.dataset.copy);} }
  else if(b.dataset.open){ open=open===b.dataset.open?null:b.dataset.open; draw(); const r=rows.find(x=>x.id===open); if(r) loadFiles(r); }
  else if(b.dataset.sum){ const r=rows.find(x=>x.id===b.dataset.sum); try{ await navigator.clipboard.writeText(summary(r)); b.textContent='¡Copiado!'; }catch(_){ prompt('Copia:',summary(r)); } }
});
init();
})();
</script>
</body>
</html>
